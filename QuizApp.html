        // 3. Quiz Screen
        const QuizScreen = ({ userInfo, answers, setAnswers, timeLeft, currentIndex, setCurrentIndex, setShowConfirm }) => {

        // 4. Result Screen
        const ResultScreen = ({ userInfo, answers, timeTaken, handleRetry }) => {
            const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);
            
            let correctCount = 0;
            questionsData.forEach((q, i) => {
                if (answers[i] === q.correctAnswer) correctCount++;
            });
            const score = (correctCount / 50) * 10;
            const optionLetters = ['A', 'B', 'C', 'D'];

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60);
                const s = seconds % 60;
                return `${m} phút ${s} giây`;
            };

            const exportPDF = async () => {
                setIsGeneratingPDF(true);
                try {
                    const resultContainer = document.getElementById('pdf-content');
                    const canvas = await html2canvas(resultContainer, { scale: 2, useCORS: true });
                    const imgData = canvas.toDataURL('image/png');
                    
                    const pdf = new window.jspdf.jsPDF('p', 'mm', 'a4');
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                    
                    let position = 0;
                    const pageHeight = pdf.internal.pageSize.getHeight();
                    
                    pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
                    position -= pageHeight;
                    
                    while (position > -pdfHeight) {
                        pdf.addPage();
                        pdf.addImage(imgData, 'PNG', 0, position, pdfWidth, pdfHeight);
                        position -= pageHeight;
                    }
                    
                    pdf.save(`Ket_Qua_Thi_${userInfo.name.replace(/\s+/g, '_')}.pdf`);
                } catch (error) {
                    console.error("PDF generation error:", error);
                    alert("Có lỗi xảy ra khi tạo PDF.");

                    setIsGeneratingPDF(false);

            return (

                                <h2 className="text-2xl font-bold opacity-90 mb-1">KẾT QUẢ BÀI THI</h2>

                            </div>
                            <div className="p-8 flex flex-col md:flex-row items-center justify-around gap-8 bg-white">
                                <div className="text-center">
                                    <div className="text-6xl font-black text-blue-600 mb-2">{score.toFixed(1)}<span className="text-2xl text-slate-400">/10</span></div>
                                    <div className="text-slate-500 font-medium">Điểm số của bạn</div>
                                </div>
                                
                                <div className="w-px h-32 bg-slate-100 hidden md:block"></div>
                                
                                <PieChart correct={correctCount} total={50} />
                                
                                <div className="space-y-4 min-w-[200px]">
                                    <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                        <span className="text-slate-500">Số câu đúng</span>
                                        <span className="font-bold text-green-500 text-lg">{correctCount}/50</span>
                                    </div>
                                    <div className="flex justify-between items-center border-b border-slate-100 pb-2">
                                        <span className="text-slate-500">Số câu sai/bỏ qua</span>
                                        <span className="font-bold text-red-500 text-lg">{50 - correctCount}/50</span>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span className="text-slate-500">Thời gian làm bài</span>
                                        <span className="font-bold text-slate-700">{formatTime(timeTaken)}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Detailed List */}
                        <div className="glass-panel p-6 md:p-8 rounded-3xl bg-white shadow-md">
                            <h3 className="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                                <Icons.Clock /> CHI TIẾT ĐÁP ÁN
                            </h3>
                            <div className="space-y-6">
                                {questionsData.map((q, i) => {
                                    const userAns = answers[i];
                                    const isCorrect = userAns === q.correctAnswer;
                                    
                                    return (
                                        <div key={i} className={`p-5 rounded-2xl border ${isCorrect ? 'border-green-200 bg-green-50/30' : 'border-red-200 bg-red-50/30'}`}>
                                            <div className="flex gap-4">
                                                <div className="mt-1">
                                                    {isCorrect ? <Icons.CheckCircle /> : <Icons.XCircle />}
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex items-center gap-2 mb-2">
                                                        <span className="font-bold text-slate-700">Câu {i + 1}:</span>
                                                        <span className="text-xs font-bold px-2 py-1 bg-white rounded border text-slate-500 shadow-sm">{q.unit}</span>
                                                    </div>
                                                    <p className="text-slate-800 font-medium mb-1 text-lg">{q.question}</p>
                                                    {q.questionTranslation && (
                                                        <p className="text-slate-500 italic mb-4 text-sm">Nghĩa: {q.questionTranslation}</p>
                                                    )}
                                                    
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-5">
                                                        {q.options.map((opt, oIdx) => {
                                                            const letter = optionLetters[oIdx];
                                                            let bgClass = "bg-white border-slate-200 text-slate-600";
                                                            if (letter === q.correctAnswer) bgClass = "bg-green-100 border-green-500 text-green-800 font-bold shadow-sm";
                                                            else if (letter === userAns) bgClass = "bg-red-100 border-red-500 text-red-800 shadow-sm";
                                                            
                                                            return (
                                                                <div key={oIdx} className={`p-3 rounded-xl border ${bgClass} flex items-center`}>
                                                                    <span className="w-8 font-bold opacity-70 flex-shrink-0">{letter}.</span> 
                                                                    <span>{opt} {q.optionsTranslations && q.optionsTranslations[oIdx] ? <span className="opacity-75 italic text-sm ml-1">({q.optionsTranslations[oIdx]})</span> : null}</span>
                                                                    {letter === q.correctAnswer && <span className="ml-auto text-green-600 pl-2 flex-shrink-0"><Icons.CheckCircle /></span>}
                                                                    {letter === userAns && !isCorrect && <span className="ml-auto text-red-600 pl-2 flex-shrink-0"><Icons.XCircle /></span>}

                                                        <div className="font-bold text-yellow-700 mb-2 flex items-center gap-2">
                                                            ⚠️ LỖI THƯỜNG GẶP:
                                                        </div>
                                                        <div className="text-yellow-800 leading-relaxed">{q.commonMistake}</div>
                                                    </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>

                    {/* Actions fixed at bottom */}
                    <div className="fixed bottom-0 left-0 right-0 p-4 glass-panel border-t border-slate-200 flex justify-center gap-4 z-50 bg-white/90 backdrop-blur-md">

                        <button onClick={exportPDF} disabled={isGeneratingPDF} className="px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 flex items-center gap-2 transition disabled:opacity-50">

        // -- Main App Component --
        function App() {
            const [screen, setScreen] = useState('start');
            const [userInfo, setUserInfo] = useState({ name: '', className: '' });
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(60 * 60);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [showConfirm, setShowConfirm] = useState(false);
            const [timeTaken, setTimeTaken] = useState(0);

            // LocalStorage Load
            useEffect(() => {
                const saved = localStorage.getItem('quiz_state');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        if (data.screen === 'quiz' && data.timeLeft > 0) {
                            setScreen(data.screen);
                            setUserInfo(data.userInfo);
                            setAnswers(data.answers || {});
                            setTimeLeft(data.timeLeft);
                            setCurrentIndex(data.currentIndex || 0);
                        }
                    } catch (e) { console.error("Error loading state", e); }
                }
            }, []);

            // LocalStorage Save
            useEffect(() => {
                if (screen === 'quiz') {
                    localStorage.setItem('quiz_state', JSON.stringify({ screen, userInfo, answers, timeLeft, currentIndex }));
                } else if (screen === 'result') {
                    localStorage.removeItem('quiz_state');
                }
            }, [screen, userInfo, answers, timeLeft, currentIndex]);

            // Timer
            useEffect(() => {
                let timer;
                if (screen === 'quiz' && !showConfirm && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                handleSubmit();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [screen, showConfirm, timeLeft]);

            // Keyboard Shortcuts
            useEffect(() => {
                if (screen !== 'quiz' || showConfirm) return;
                
                const handleKeyDown = (e) => {
                    if (e.key === 'ArrowRight') {
                        setCurrentIndex(prev => Math.min(questionsData.length - 1, prev + 1));
                    } else if (e.key === 'ArrowLeft') {
                        setCurrentIndex(prev => Math.max(0, prev - 1));
                    } else if (['a', 'b', 'c', 'd'].includes(e.key.toLowerCase())) {
                        const map = { 'a': 'A', 'b': 'B', 'c': 'C', 'd': 'D' };
                        setAnswers(prev => ({ ...prev, [currentIndex]: map[e.key.toLowerCase()] }));
                    } else if (e.key === 'Enter' && currentIndex === questionsData.length - 1) {
                        setShowConfirm(true);
                    }
                };
                
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [screen, showConfirm, currentIndex]);

            // Prevent closing window
            useEffect(() => {
                if (screen === 'quiz') {
                    const handleBeforeUnload = (e) => {
                        e.preventDefault();
                        e.returnValue = '';
                    };
                    window.addEventListener('beforeunload', handleBeforeUnload);
                    return () => window.removeEventListener('beforeunload', handleBeforeUnload);
                }
            }, [screen]);

            const handleStart = (e) => {
                e.preventDefault();
                setScreen('quiz');
                setTimeLeft(60 * 60);
                setAnswers({});
                setCurrentIndex(0);
                setTimeTaken(0);
            };

            const handleSubmit = useCallback(() => {
                setTimeTaken(60 * 60 - timeLeft);
                setShowConfirm(false);
                setScreen('result');
            }, [timeLeft]);

            const handleRetry = () => {
                if (confirm("Bạn có chắc chắn muốn làm lại từ đầu? Mọi kết quả sẽ bị xóa.")) {
                    setScreen('start');
                    setAnswers({});
                    setUserInfo({ name: '', className: '' });
                    localStorage.removeItem('quiz_state');
                }
            };

            return (
                <div className="antialiased">
                    {screen === 'start' && (
                        <StartScreen onStart={handleStart} userInfo={userInfo} setUserInfo={setUserInfo} />
                    )}
                    
                    {screen === 'quiz' && (
                        <QuizScreen 
                            userInfo={userInfo} answers={answers} setAnswers={setAnswers}
                            timeLeft={timeLeft} currentIndex={currentIndex} 
                            setCurrentIndex={setCurrentIndex} setShowConfirm={setShowConfirm}
                        />
                    )}
                    
                    {screen === 'result' && (
                        <ResultScreen userInfo={userInfo} answers={answers} timeTaken={timeTaken} handleRetry={handleRetry} />
                    )}

                    {/* Submit Modal */}
                    {showConfirm && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-4 fade-enter-active">
                            <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl">
                                <Icons.Alert />
                                <h3 className="text-2xl font-bold text-center mb-2 text-slate-800">Xác nhận nộp bài?</h3>
                                <p className="text-center text-slate-600 mb-8 leading-relaxed">
                                    Bạn đã hoàn thành <span className="font-bold text-blue-600 text-lg">{Object.keys(answers).length}/50</span> câu hỏi.
                                    Sau khi nộp sẽ không thể thay đổi đáp án.
                                </p>
                                <div className="flex flex-col gap-3">
                                    <button onClick={handleSubmit} className="w-full py-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-200 transition text-lg">
                                        Nộp bài ngay
                                    </button>
                                    <button onClick={() => setShowConfirm(false)} className="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition">
                                        Quay lại làm tiếp
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
